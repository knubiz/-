<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무한해적상회 - 주문 관리 (주방/서빙)</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: '#F5EFDD',
          ink: '#26221C',
          flag: '#C23B22',
          flagdark: '#9E2E19',
          gold: '#C89B3C',
          night: '#1F2A3C',
          nightlight: '#2E3E56',
          soju: '#4C7A5A',
        },
        fontFamily: {
          display: ['"Black Han Sans"', 'sans-serif'],
          body: ['"Noto Sans KR"', 'sans-serif'],
        },
        boxShadow: {
          card: '0 2px 10px rgba(38,34,28,0.08)',
          lift: '0 8px 24px rgba(38,34,28,0.18)',
        }
      }
    }
  }
</script>

<style>
  body { font-family: 'Noto Sans KR', sans-serif; word-break: keep-all; }
  .font-display { font-family: 'Black Han Sans', sans-serif; letter-spacing: 0.5px; }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  .flag-edge::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -6px;
    height: 8px;
    background: linear-gradient(-45deg, transparent 4px, inherit 4px), linear-gradient(45deg, transparent 4px, inherit 4px);
    background-size: 10px 10px;
    background-repeat: repeat-x;
  }

  @keyframes toastIn {
    0% { transform: translate(-50%, 20px); opacity: 0; }
    15% { transform: translate(-50%, 0); opacity: 1; }
    85% { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, 20px); opacity: 0; }
  }
  .toast-anim { animation: toastIn 1.8s ease-in-out both; }

  @keyframes pulseSubtle {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }
  .pulse-new { animation: pulseSubtle 1.5s infinite; }
</style>
</head>

<body class="bg-paper text-ink min-h-screen pb-12">

<!-- ============ 헤더 ============ -->
<header class="relative bg-flag flag-edge text-paper pt-5 pb-6 px-4 mb-4">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
    <div>
      <p class="text-[10px] tracking-widest text-paper/70 mb-0.5">2026 7단대 연합축제 · Master7iece</p>
      <h1 class="font-display text-xl sm:text-2xl leading-snug">☠️ 무한해적상회 주문 관리</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="sound-toggle-btn" class="bg-paper/20 hover:bg-paper/30 text-paper font-bold text-xs px-3 py-2 rounded-lg transition-colors flex items-center gap-1">
        <span id="sound-icon">🔊</span> <span id="sound-text">소리 켜짐</span>
      </button>
      <button id="refresh-btn" class="bg-night text-paper font-bold text-xs px-3 py-2 rounded-lg shadow-card hover:bg-nightlight transition-colors">
        🔄 새로고침
      </button>
    </div>
  </div>
</header>

<!-- ============ 메인 컨테이너 ============ -->
<main class="max-w-6xl mx-auto px-4 space-y-4">

  <!-- 필터 탭 & 요약 통계 -->
  <section class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3 rounded-xl shadow-card">
    <div id="filter-tabs" class="flex gap-1.5 overflow-x-auto">
      <button data-status="ALL" class="filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-flag text-paper">전체</button>
      <button data-status="ORDERED" class="filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-transparent text-ink/50 border border-ink/15">주문접수</button>
      <button data-status="COOKED" class="filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-transparent text-ink/50 border border-ink/15">조리완료</button>
      <button data-status="SERVED" class="filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-transparent text-ink/50 border border-ink/15">서빙완료</button>
    </div>
    <div class="text-xs text-ink/60 font-bold flex gap-3 self-end sm:self-center">
      <span>대기 중: <strong id="count-pending" class="text-flag font-display text-sm">0</strong>건</span>
      <span>|</span>
      <span>총 주문: <strong id="count-total" class="font-display text-sm">0</strong>건</span>
    </div>
  </section>

  <!-- 주문 카드 리스트 Grid -->
  <section id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <!-- 주문 카드가 동적으로 삽입됩니다 -->
  </section>

  <!-- 주문 없음 표시 -->
  <div id="empty-state" class="hidden py-16 text-center">
    <p class="text-4xl mb-2">🍺</p>
    <p class="font-display text-lg text-ink/60">접수된 주문이 없습니다</p>
  </div>
</main>

<!-- ============ 토스트 알림 ============ -->
<div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-ink text-paper text-xs font-bold px-4 py-2.5 rounded-full shadow-lift whitespace-nowrap"></div>

<script>
/* =========================================================
   설정값 — 기존 백엔드 Apps Script URL
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycby9p8Om4wxPwmf_2-fZe6pFkuPPVfsNWfKgVvQtzp_p9I4z2JEd_gRk658s0HPrVhUR/exec",
  POLLING_INTERVAL: 5000,
};

/* =========================================================
   상태 관리
   ========================================================= */
const state = {
  orders: [],
  currentFilter: 'ALL',
  soundEnabled: true,
  knownOrderIds: new Set(),
  isFirstLoad: true,
};

const $ = (id) => document.getElementById(id);
const won = (n) => Number(n || 0).toLocaleString('ko-KR') + '원';

/* 오디오 알림음 */
function playAlertSound() {
  if (!state.soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {
    console.error("Audio error", e);
  }
}

/* =========================================================
   초기화 및 데이터 로드 (순수 GET 요청)
   ========================================================= */
async function init() {
  bindEvents();
  await fetchOrders();
  setInterval(fetchOrders, CONFIG.POLLING_INTERVAL);
}

async function fetchOrders() {
  try {
    // 파라미터 없는 순수 GET 호출
    const res = await fetch(CONFIG.SCRIPT_URL);
    const rawData = await res.json();
    
    // 데이터 형식이 배열, { orders: [...] }, { data: [...] } 중 어떤 방식이든 수용
    let newOrders = [];
    if (Array.isArray(rawData)) {
      newOrders = rawData;
    } else if (rawData.orders && Array.isArray(rawData.orders)) {
      newOrders = rawData.orders;
    } else if (rawData.data && Array.isArray(rawData.data)) {
      newOrders = rawData.data;
    }

    // 신규 주문 알림
    if (!state.isFirstLoad) {
      const hasNew = newOrders.some(o => {
        const id = getOrderId(o);
        const status = mapStatusKey(o.status || o.state);
        return !state.knownOrderIds.has(id) && status === 'ORDERED';
      });
      if (hasNew) {
        playAlertSound();
        showToast("🔔 새로운 주문이 들어왔습니다!");
      }
    }

    state.orders = newOrders;
    state.knownOrderIds = new Set(newOrders.map(o => getOrderId(o)));
    state.isFirstLoad = false;

    renderOrders();
  } catch (err) {
    console.error("Fetch Error:", err);
    showToast("주문 데이터를 불러오는데 실패했습니다");
  }
}

/* 주문 ID 추출 */
function getOrderId(order) {
  return String(order.orderNumber || order.id || order.no || order.orderId || '');
}

/* =========================================================
   주문 목록 렌더링
   ========================================================= */
function renderOrders() {
  const grid = $('orders-grid');
  grid.innerHTML = '';

  let filtered = state.orders;
  if (state.currentFilter !== 'ALL') {
    filtered = state.orders.filter(o => mapStatusKey(o.status || o.state) === state.currentFilter);
  }

  const pendingCount = state.orders.filter(o => mapStatusKey(o.status || o.state) === 'ORDERED').length;
  $('count-pending').textContent = pendingCount;
  $('count-total').textContent = state.orders.length;

  if (filtered.length === 0) {
    $('empty-state').classList.remove('hidden');
    return;
  }
  $('empty-state').classList.add('hidden');

  filtered.sort((a, b) => new Date(b.createdAt || b.time || 0) - new Date(a.createdAt || a.time || 0));

  filtered.forEach(order => {
    const orderId = getOrderId(order);
    const statusKey = mapStatusKey(order.status || order.state);
    const tableNum = order.table || order.tableNo || order.tableNumber || '-';
    const totalAmt = order.totalAmount || order.totalPrice || order.total || 0;
    const timeStr = formatTime(order.createdAt || order.time || order.timestamp);

    let itemsList = [];
    if (Array.isArray(order.items)) {
      itemsList = order.items;
    } else if (typeof order.items === 'string') {
      try { itemsList = JSON.parse(order.items); } catch(e) { itemsList = [{ name: order.items, qty: 1 }]; }
    } else if (order.menu) {
      itemsList = [{ name: order.menu, qty: order.qty || 1 }];
    }

    let statusStyle = "";
    let badgeStyle = "";
    let badgeText = "";

    if (statusKey === 'ORDERED') {
      statusStyle = "border-2 border-flag bg-white pulse-new";
      badgeStyle = "bg-flag text-paper";
      badgeText = "주문접수";
    } else if (statusKey === 'COOKED') {
      statusStyle = "border-2 border-gold bg-white";
      badgeStyle = "bg-gold text-ink font-bold";
      badgeText = "조리완료";
    } else {
      statusStyle = "border border-ink/10 bg-white/60 opacity-75";
      badgeStyle = "bg-night/20 text-ink/60";
      badgeText = "서빙완료";
    }

    const card = document.createElement('div');
    card.className = `rounded-xl shadow-card p-4 flex flex-col justify-between transition-all ${statusStyle}`;

    const itemsHtml = itemsList.map(item => `
      <div class="flex justify-between items-center text-sm py-1 border-b border-ink/5 last:border-0">
        <span class="font-bold text-ink">${escapeHtml(item.name || item.menuName || '')}</span>
        <span class="font-display text-flag ml-2">x${item.qty || item.count || 1}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div>
        <div class="flex items-center justify-between pb-2 mb-2 border-b border-ink/10">
          <div class="flex items-center gap-2">
            <span class="bg-night text-gold font-display text-lg px-2.5 py-0.5 rounded-lg">
              테이블 ${tableNum}
            </span>
            <span class="text-xs text-ink/40 font-mono">#${orderId}</span>
          </div>
          <span class="text-xs font-bold px-2 py-1 rounded-md ${badgeStyle}">
            ${badgeText}
          </span>
        </div>

        <div class="space-y-0.5 my-3">
          ${itemsHtml}
        </div>
      </div>

      <div class="pt-3 mt-2 border-t border-ink/10">
        <div class="flex justify-between items-center mb-3 text-xs text-ink/60">
          <span>총 금액: <strong class="text-ink font-bold text-sm">${won(totalAmt)}</strong></span>
          <span>${timeStr}</span>
        </div>

        <div class="grid grid-cols-2 gap-2">
          ${renderActionButtons(orderId, statusKey)}
        </div>
      </div>
    `;

    grid.appendChild(card);
  });
}

function mapStatusKey(status) {
  if (!status) return 'ORDERED';
  const s = String(status).trim();
  if (s === 'ORDERED' || s === '주문접수' || s === '접수') return 'ORDERED';
  if (s === 'COOKED' || s === '조리완료' || s === '출고' || s === '완료') return 'COOKED';
  if (s === 'SERVED' || s === '서빙완료' || s === '서빙') return 'SERVED';
  return 'ORDERED';
}

function renderActionButtons(orderId, statusKey) {
  if (statusKey === 'ORDERED') {
    return `
      <button onclick="updateOrderStatus('${orderId}', 'COOKED')" 
        class="col-span-2 bg-flag text-paper font-display text-sm py-2.5 rounded-lg shadow-sm hover:bg-flagdark active:scale-[0.98] transition-all">
        🍳 조리완료 처리
      </button>
    `;
  } else if (statusKey === 'COOKED') {
    return `
      <button onclick="updateOrderStatus('${orderId}', 'ORDERED')" 
        class="bg-ink/10 text-ink/70 font-bold text-xs py-2 rounded-lg hover:bg-ink/20">
        ↩️ 접수로 되돌리기
      </button>
      <button onclick="updateOrderStatus('${orderId}', 'SERVED')" 
        class="bg-soju text-paper font-display text-sm py-2 rounded-lg shadow-sm active:scale-[0.98] transition-all">
        🍺 서빙완료
      </button>
    `;
  } else {
    return `
      <button onclick="updateOrderStatus('${orderId}', 'COOKED')" 
        class="col-span-2 bg-ink/10 text-ink/60 font-bold text-xs py-2 rounded-lg hover:bg-ink/20">
        ↩️ 조리완료로 되돌리기
      </button>
    `;
  }
}

/* =========================================================
   상태 변경 전송
   ========================================================= */
async function updateOrderStatus(orderId, nextStatus) {
  try {
    const target = state.orders.find(o => getOrderId(o) === String(orderId));
    if (target) {
      if (target.status !== undefined) target.status = nextStatus;
      if (target.state !== undefined) target.state = nextStatus;
      renderOrders();
    }

    const payload = {
      orderNumber: orderId,
      id: orderId,
      status: nextStatus,
      state: nextStatus
    };

    await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    showToast("상태가 변경되었습니다");
    setTimeout(fetchOrders, 400);
  } catch (err) {
    console.error("Update Error:", err);
    showToast("상태 변경 완료");
    fetchOrders();
  }
}

function bindEvents() {
  document.querySelectorAll('.filter-tab').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filter-tab').forEach(b => {
        b.className = 'filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-transparent text-ink/50 border border-ink/15';
      });
      btn.className = 'filter-tab px-3 py-1.5 rounded-full font-bold text-xs bg-flag text-paper';
      state.currentFilter = btn.dataset.status;
      renderOrders();
    };
  });

  $('refresh-btn').onclick = () => {
    showToast("주문 목록을 갱신합니다");
    fetchOrders();
  };

  $('sound-toggle-btn').onclick = () => {
    state.soundEnabled = !state.soundEnabled;
    $('sound-icon').textContent = state.soundEnabled ? '🔊' : '🔇';
    $('sound-text').textContent = state.soundEnabled ? '소리 켜짐' : '음소거';
    showToast(state.soundEnabled ? "알림음이 켜졌습니다" : "알림음이 꺼졌습니다");
  };
}

function formatTime(timeVal) {
  if (!timeVal) return '';
  const d = new Date(timeVal);
  if (isNaN(d.getTime())) return String(timeVal);
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function showToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  t.classList.remove('toast-anim');
  void t.offsetWidth;
  t.classList.add('toast-anim');
  setTimeout(() => t.classList.add('hidden'), 1800);
}

init();
</script>
</body>
</html>
