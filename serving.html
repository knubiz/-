<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>무한해적상회 - 주방 KDS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: '#F5EFDD',
          ink: '#26221C',
          flag: '#C23B22',
          flagdark: '#9E2E19',
          gold: '#C89B3C',
          night: '#1F2A3C',
          nightlight: '#2E3E56',
          soju: '#4C7A5A',
        },
        fontFamily: {
          display: ['"Black Han Sans"', 'sans-serif'],
          body: ['"Noto Sans KR"', 'sans-serif'],
        },
        boxShadow: {
          card: '0 2px 10px rgba(38,34,28,0.08)',
          lift: '0 8px 24px rgba(38,34,28,0.18)',
        }
      }
    }
  }
</script>

<style>
  body { font-family: 'Noto Sans KR', sans-serif; word-break: keep-all; user-select: none; }
  .font-display { font-family: 'Black Han Sans', sans-serif; letter-spacing: 0.5px; }
  ::-webkit-scrollbar { display: none; }
  * { -ms-overflow-style: none; scrollbar-width: none; }

  .table-card { transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease; }

  .table-card.warning-near {
    border-color: #C89B3C !important;
    box-shadow: 0 0 0 3px rgba(200,155,60,0.18);
  }

  .table-card.warning-over {
    border-color: #C23B22 !important;
    background-color: #FBEAE6 !important;
    animation: blink-border 1.2s infinite alternate;
  }

  @keyframes blink-border {
    0%   { box-shadow: 0 0 0 3px rgba(194,59,34,0.12); }
    100% { box-shadow: 0 0 0 5px rgba(194,59,34,0.32); }
  }

  .over-time-badge { animation: blink-text 1s infinite alternate; }
  @keyframes blink-text { 0% { opacity: 0.65; } 100% { opacity: 1; } }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade-in { animation: fadeIn 0.2s ease-out both; }

  @keyframes sheetIn { from { transform: translateY(16px); opacity:0; } to { transform: translateY(0); opacity:1; } }
  .sheet-in { animation: sheetIn 0.22s ease-out both; }

  .unit-dot { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .line-clamp-2 {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
</style>
</head>

<body class="bg-paper text-ink min-h-screen pb-6">

<!-- 헤더 -->
<header class="bg-night text-paper px-4 pt-4 pb-3 sticky top-0 z-20 shadow-card">
  <div class="flex items-center justify-between gap-2">
    <h1 class="font-display text-lg sm:text-xl">👨‍🍳 무한해적상회 · 주방 현황판</h1>
    <div class="flex items-center gap-1.5 text-[11px] text-paper/70">
      <span id="status-dot" class="w-2 h-2 rounded-full bg-soju"></span>
      <span id="sync-status">연결 중...</span>
    </div>
  </div>
  <div class="mt-2.5 flex items-center gap-1.5 overflow-x-auto">
    <button id="tab-table-view" onclick="switchView('table')"
      class="shrink-0 px-3 py-1.5 rounded-full font-bold text-xs border-2 transition-colors">
      🔲 테이블별 보기
    </button>
    <button id="tab-menu-view" onclick="switchView('menu')"
      class="shrink-0 px-3 py-1.5 rounded-full font-bold text-xs border-2 transition-colors">
      🍶 메뉴별 보기
    </button>
    <span class="w-px h-5 bg-paper/20 mx-0.5 shrink-0"></span>
    <button id="btn-filter" onclick="toggleOverTimeFilter()"
      class="shrink-0 px-3 py-1.5 rounded-full font-bold text-xs border-2 border-flag text-flag bg-paper transition-colors">
      ⚠️ 1시간 지연만 보기
    </button>
  </div>
</header>

<!-- 테이블별 보기 -->
<main class="px-3 pt-3" id="view-table">
  <div class="grid grid-cols-4 sm:grid-cols-5 gap-2" id="grid-container"></div>
</main>

<!-- 메뉴별 보기: 같은 메뉴를 기다리는 테이블을 대기시간 순으로 한눈에 -->
<main class="px-3 pt-3 hidden space-y-2.5" id="view-menu-list"></main>

<!-- 상세 모달 -->
<div class="fixed inset-0 z-40 bg-ink/60 hidden items-center justify-center p-4 fade-in" id="modal-overlay">
  <div class="bg-paper rounded-2xl w-full max-w-md max-h-[85vh] flex flex-col shadow-lift border border-ink/10 sheet-in">
    <div class="bg-flag text-paper px-4 py-3 flex items-center justify-between rounded-t-2xl shrink-0">
      <span class="font-display text-lg" id="modal-title">테이블 0</span>
      <button class="text-2xl leading-none px-1" onclick="closeModal()">&times;</button>
    </div>
    <div class="px-4 pt-3 pb-2 overflow-y-auto flex-1">
      <p class="text-xs font-bold text-flag mb-3" id="modal-time-info"></p>
      <ul class="space-y-2.5" id="modal-item-list"></ul>
    </div>
    <div class="px-4 pt-3 pb-4 border-t border-ink/10 shrink-0">
      <p class="text-[11px] text-ink/50 text-center mb-2">동그라미를 하나씩 눌러 조리 완료 표시를 할 수 있어요</p>
      <button class="w-full bg-soju text-paper font-display text-base py-3 rounded-xl active:scale-[0.98] transition-transform"
        onclick="completeAllTableItems()">
        테이블 전체 완료
      </button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   설정값
   ========================================================= */
const CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycby9p8Om4wxPwmf_2-fZe6pFkuPPVfsNWfKgVvQtzp_p9I4z2JEd_gRk658s0HPrVhUR/exec',
  TOTAL_TABLES: 35,
  REFRESH_INTERVAL: 4000,
  WARN_MINUTES_NEAR: 30,
  WARN_MINUTES_OVER: 60,
};

let currentActiveOrders = {};
let selectedTableNum = null;
let isFilterOverTime = false;
let currentView = 'menu'; // 'table' | 'menu' — 메뉴별 보기를 기본으로

/* rowNum -> 몇 개까지 로컬로 "완료" 표시했는지 (전체 수량에 도달하면 서버에 완료 요청) */
let unitProgress = {};

const $ = (id) => document.getElementById(id);

window.onload = function () {
  renderTableGrid();
  switchView('menu');
  fetchKitchenOrders();
  setInterval(fetchKitchenOrders, CONFIG.REFRESH_INTERVAL);
  setInterval(refreshCurrentView, 10000);
};

/* =========================================================
   보기 전환 (테이블별 / 메뉴별)
   ========================================================= */
function switchView(view) {
  currentView = view;
  $('view-table').classList.toggle('hidden', view !== 'table');
  $('view-menu-list').classList.toggle('hidden', view !== 'menu');
  applyViewTabStyles();
  refreshCurrentView();
}

function applyViewTabStyles() {
  const tableBtn = $('tab-table-view');
  const menuBtn = $('tab-menu-view');
  const active = 'bg-paper text-night border-paper';
  const inactive = 'bg-transparent text-paper/70 border-paper/30';
  tableBtn.className = 'shrink-0 px-3 py-1.5 rounded-full font-bold text-xs border-2 transition-colors ' + (currentView === 'table' ? active : inactive);
  menuBtn.className = 'shrink-0 px-3 py-1.5 rounded-full font-bold text-xs border-2 transition-colors ' + (currentView === 'menu' ? active : inactive);
}

function refreshCurrentView() {
  if (currentView === 'menu') {
    renderMenuView();
  } else {
    updateTimesUI();
  }
  if (selectedTableNum && currentActiveOrders[selectedTableNum]) {
    renderModalContent(currentActiveOrders[selectedTableNum]);
  }
}

/* =========================================================
   테이블 그리드
   ========================================================= */
function renderTableGrid() {
  const container = $('grid-container');
  container.innerHTML = '';

  for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
    const card = document.createElement('div');
    card.className = 'table-card bg-white rounded-xl border-2 border-ink/10 shadow-card p-2.5 min-h-[100px] flex flex-col justify-between cursor-pointer active:scale-[0.97] transition-transform';
    card.id = `table-box-${i}`;
    card.onclick = () => openModal(i);

    card.innerHTML = `
      <div class="flex justify-between items-start">
        <span class="font-display text-base text-ink/70" id="table-num-${i}">${i}</span>
        <div class="text-[10px] text-ink/40 text-right" id="table-time-${i}"></div>
      </div>
      <div class="text-[11px] text-ink/50 mt-1 line-clamp-2" id="table-summary-${i}">빈 테이블</div>
      <div class="flex gap-1 mt-1 flex-wrap" id="table-badge-${i}"></div>
    `;
    container.appendChild(card);
  }
}

/* =========================================================
   데이터 가져오기
   ========================================================= */
function fetchKitchenOrders() {
  fetch(`${CONFIG.GAS_URL}?action=kitchen`)
    .then(res => res.json())
    .then(data => {
      if (data.success && data.orders) {
        processOrders(data.orders);
        $('sync-status').innerText = '실시간 수신 중';
        $('status-dot').className = 'w-2 h-2 rounded-full bg-soju';
      }
    })
    .catch(err => {
      console.error('주문 불러오기 오류:', err);
      $('sync-status').innerText = '연결 확인 필요';
      $('status-dot').className = 'w-2 h-2 rounded-full bg-flag';
    });
}

function parseOrderDate(timeStr) {
  if (!timeStr) return new Date();
  const now = new Date();
  const parts = timeStr.split(':');
  if (parts.length >= 2) {
    now.setHours(parseInt(parts[0], 10));
    now.setMinutes(parseInt(parts[1], 10));
    now.setSeconds(0);
  }
  return now;
}

/* =========================================================
   주문 병합
   같은 메뉴가 여러 번 주문되면 occurrences 배열에 각 주문 건(rowNum)을
   별도로 저장해서, 조리 완료도 각 건 단위(그리고 그 안에서 1개씩)로
   처리할 수 있도록 한다.
   ========================================================= */
function processOrders(orders) {
  currentActiveOrders = {};

  for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
    const box = $(`table-box-${i}`);
    if (box) {
      box.className = 'table-card bg-white rounded-xl border-2 border-ink/10 shadow-card p-2.5 min-h-[100px] flex flex-col justify-between cursor-pointer active:scale-[0.97] transition-transform';
      $(`table-summary-${i}`).innerText = '빈 테이블';
      $(`table-time-${i}`).innerHTML = '';
      $(`table-badge-${i}`).innerHTML = '';
    }
  }

  orders.forEach(order => {
    const rawTable = String(order.table || '');
    const match = rawTable.match(/\d+/);
    const tableNum = match ? parseInt(match[0], 10) : null;

    if (tableNum && tableNum >= 1 && tableNum <= CONFIG.TOTAL_TABLES) {
      const validItems = (order.items || []).filter(item => {
        const name = String(item.name || '').trim();
        return !name.startsWith('인원') && !name.includes('인원수');
      });

      if (validItems.length === 0) return;

      if (!currentActiveOrders[tableNum]) {
        currentActiveOrders[tableNum] = {
          table: tableNum,
          firstTimeStr: order.time,
          firstTimeObj: parseOrderDate(order.time),
          orderNumbers: [order.orderNumber],
          items: []
        };
      } else {
        if (!currentActiveOrders[tableNum].orderNumbers.includes(order.orderNumber)) {
          currentActiveOrders[tableNum].orderNumbers.push(order.orderNumber);
        }
      }

      validItems.forEach(newItem => {
        const qty = parseInt(newItem.qty || 1, 10);
        const tableData = currentActiveOrders[tableNum];
        let existingItem = tableData.items.find(i => i.name === newItem.name);

        const occurrence = { rowNum: newItem.rowNum, orderId: order.orderNumber, qty };

        if (existingItem) {
          existingItem.qty += qty;
          existingItem.occurrences.push(occurrence);
        } else {
          tableData.items.push({
            name: newItem.name,
            qty: qty,
            occurrences: [occurrence]
          });
        }
      });
    }
  });

  if (selectedTableNum && !currentActiveOrders[selectedTableNum]) {
    closeModal();
  }

  refreshCurrentView();
}

/* =========================================================
   경과시간 계산 (테이블별 보기 / 메뉴별 보기 공용)
   ========================================================= */
function computeElapsed(dateObj) {
  const now = new Date();
  const diffMs = now - dateObj;
  const diffMinutes = Math.floor(diffMs / (1000 * 60));
  const hours = Math.floor(diffMinutes / 60);
  const mins = diffMinutes % 60;
  const formatted = `${hours > 0 ? hours + '시간 ' : ''}${mins}분 경과`;
  const isOver = diffMinutes >= CONFIG.WARN_MINUTES_OVER;
  const isNear = !isOver && diffMinutes >= CONFIG.WARN_MINUTES_NEAR;
  return { diffMinutes, formatted, isOver, isNear };
}

/* =========================================================
   경과시간 & 카드 표시 (테이블별 보기)
   ========================================================= */
function updateTimesUI() {
  for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
    const box = $(`table-box-${i}`);
    const tableData = currentActiveOrders[i];

    if (!tableData || !tableData.items || tableData.items.length === 0) {
      if (box) box.style.display = isFilterOverTime ? 'none' : 'flex';
      continue;
    }

    const { formatted: formattedElapsed, isOver, isNear } = computeElapsed(tableData.firstTimeObj);

    box.classList.remove('warning-near', 'warning-over');
    box.classList.add('border-flag/40');

    let elapsedClass = 'text-ink/50';
    if (isOver) {
      box.classList.add('warning-over');
      elapsedClass = 'text-flag';
    } else if (isNear) {
      box.classList.add('warning-near');
      elapsedClass = 'text-gold';
    }

    box.style.display = (isFilterOverTime && !isOver) ? 'none' : 'flex';

    const firstItem = tableData.items[0].name;
    const totalQty = tableData.items.reduce((sum, item) => sum + item.qty, 0);
    const summaryText = tableData.items.length > 1
      ? `${firstItem} 외 ${tableData.items.length - 1}건`
      : `${firstItem} ${tableData.items[0].qty}개`;

    $(`table-summary-${i}`).innerText = summaryText;
    $(`table-time-${i}`).innerHTML = `
      <span>${tableData.firstTimeStr}</span>
      <span class="block font-bold text-[11px] ${elapsedClass}">⏱ ${formattedElapsed}</span>
    `;

    let badgeHtml = `<span class="bg-night text-paper text-[10px] font-bold px-1.5 py-0.5 rounded-full">${totalQty}개</span>`;
    if (isOver) {
      badgeHtml += `<span class="over-time-badge bg-flag text-paper text-[10px] font-bold px-1.5 py-0.5 rounded-full">🚨 지연</span>`;
    }
    $(`table-badge-${i}`).innerHTML = badgeHtml;
  }
}

/* =========================================================
   메뉴별 보기: 같은 메뉴를 기다리는 테이블을 대기시간 순으로 모아서 보여줌
   ========================================================= */
function buildMenuAggregate() {
  const map = {};

  Object.values(currentActiveOrders).forEach(tableData => {
    tableData.items.forEach(item => {
      if (!map[item.name]) map[item.name] = { name: item.name, entries: [] };
      map[item.name].entries.push({
        table: tableData.table,
        totalQty: item.qty,
        occurrences: item.occurrences,
        firstTimeStr: tableData.firstTimeStr,
        firstTimeObj: tableData.firstTimeObj
      });
    });
  });

  const groups = Object.values(map);
  // 각 메뉴 안에서는 오래 기다린 테이블이 위로
  groups.forEach(g => g.entries.sort((a, b) => a.firstTimeObj - b.firstTimeObj));
  // 메뉴 카드 자체도 가장 오래 기다린 테이블이 있는 메뉴가 위로
  groups.sort((a, b) => a.entries[0].firstTimeObj - b.entries[0].firstTimeObj);
  return groups;
}

function renderMenuView() {
  const container = $('view-menu-list');
  const groups = buildMenuAggregate();

  if (groups.length === 0) {
    container.innerHTML = `<p class="text-center text-ink/40 text-sm py-10">대기 중인 주문이 없어요 🍶</p>`;
    return;
  }

  container.innerHTML = '';

  groups.forEach(group => {
    // 필터가 켜져 있으면 지연된 테이블이 하나도 없는 메뉴는 숨김
    const visibleEntries = isFilterOverTime
      ? group.entries.filter(e => computeElapsed(e.firstTimeObj).isOver)
      : group.entries;
    if (visibleEntries.length === 0) return;

    const totalQty = visibleEntries.reduce((s, e) => s + e.totalQty, 0);
    const anyOver = visibleEntries.some(e => computeElapsed(e.firstTimeObj).isOver);

    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl shadow-card p-3' + (anyOver ? ' warning-over border-2 border-flag' : ' border-2 border-ink/10');

    let rowsHtml = '';
    visibleEntries.forEach(entry => {
      const { formatted, isOver, isNear } = computeElapsed(entry.firstTimeObj);
      const badgeClass = isOver ? 'text-flag' : (isNear ? 'text-gold' : 'text-ink/50');

      let dotsHtml = '';
      entry.occurrences.forEach(occ => {
        const done = unitProgress[occ.rowNum] || 0;
        let rowDots = '';
        for (let idx = 0; idx < occ.qty; idx++) {
          const isDone = idx < done;
          rowDots += `
            <button
              class="unit-dot w-7 h-7 rounded-full border-2 font-display text-xs flex items-center justify-center active:scale-90 transition-transform ${
                isDone ? 'bg-soju border-soju text-paper' : 'bg-paper border-ink/20 text-ink/40'
              }"
              onclick="toggleUnit('${occ.rowNum}', '${occ.orderId}', ${occ.qty}, ${idx})">
              ${isDone ? '✓' : idx + 1}
            </button>`;
        }
        dotsHtml += `<div class="flex items-center gap-1.5 flex-wrap mt-1">${rowDots}</div>`;
      });

      rowsHtml += `
        <div class="py-2 ${entry !== visibleEntries[visibleEntries.length - 1] ? 'border-b border-ink/10' : ''}">
          <div class="flex items-center justify-between">
            <button class="font-display text-base text-ink" onclick="openModal(${entry.table})">테이블 ${entry.table}</button>
            <span class="text-xs font-bold ${badgeClass}">⏱ ${formatted}${isOver ? ' 🚨' : ''}</span>
          </div>
          ${dotsHtml}
        </div>`;
    });

    card.innerHTML = `
      <div class="flex items-center justify-between mb-1">
        <span class="font-bold text-sm">${group.name}</span>
        <span class="bg-ink/5 text-ink/60 text-xs font-bold px-2 py-0.5 rounded-full">총 ${totalQty}개 · ${visibleEntries.length}테이블</span>
      </div>
      ${rowsHtml}
    `;
    container.appendChild(card);
  });

  if (!container.innerHTML.trim()) {
    container.innerHTML = `<p class="text-center text-ink/40 text-sm py-10">1시간 넘게 지연된 메뉴가 없어요 👍</p>`;
  }
}

function toggleOverTimeFilter() {
  isFilterOverTime = !isFilterOverTime;
  const btn = $('btn-filter');
  btn.classList.toggle('bg-flag', isFilterOverTime);
  btn.classList.toggle('text-paper', isFilterOverTime);
  btn.classList.toggle('bg-paper', !isFilterOverTime);
  btn.classList.toggle('text-flag', !isFilterOverTime);
  btn.innerText = isFilterOverTime ? '📋 전체 보기' : '⚠️ 1시간 지연만 보기';
  refreshCurrentView();
}

/* =========================================================
   모달
   ========================================================= */
function openModal(tableNum) {
  const tableData = currentActiveOrders[tableNum];
  if (!tableData || !tableData.items || tableData.items.length === 0) return;

  selectedTableNum = tableNum;
  renderModalContent(tableData);
  const overlay = $('modal-overlay');
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
}

function closeModal() {
  selectedTableNum = null;
  const overlay = $('modal-overlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}

function renderModalContent(tableData) {
  const now = new Date();
  const diffMs = now - tableData.firstTimeObj;
  const diffMinutes = Math.floor(diffMs / (1000 * 60));

  $('modal-title').innerText = `테이블 ${tableData.table}`;
  $('modal-time-info').innerText = `최초 주문 ${tableData.firstTimeStr} · 조리 지연 ${diffMinutes}분 경과`;

  const list = $('modal-item-list');
  list.innerHTML = '';

  tableData.items.forEach(item => {
    const li = document.createElement('li');
    li.className = 'bg-white rounded-xl shadow-card p-3';

    let dotsHtml = '';
    item.occurrences.forEach(occ => {
      const done = unitProgress[occ.rowNum] || 0;
      let rowDots = '';
      for (let idx = 0; idx < occ.qty; idx++) {
        const isDone = idx < done;
        rowDots += `
          <button
            class="unit-dot w-7 h-7 rounded-full border-2 font-display text-xs flex items-center justify-center active:scale-90 transition-transform ${
              isDone
                ? 'bg-soju border-soju text-paper'
                : 'bg-paper border-ink/20 text-ink/40'
            }"
            onclick="toggleUnit('${occ.rowNum}', '${occ.orderId}', ${occ.qty}, ${idx})">
            ${isDone ? '✓' : idx + 1}
          </button>`;
      }
      dotsHtml += `<div class="flex items-center gap-1.5 flex-wrap mt-1.5">${rowDots}</div>`;
    });

    li.innerHTML = `
      <div class="flex items-center justify-between mb-0.5">
        <span class="font-bold text-sm">${item.name}</span>
        <span class="bg-ink/5 text-ink/60 text-xs font-bold px-2 py-0.5 rounded-full">${item.qty}개</span>
      </div>
      ${dotsHtml}
    `;
    list.appendChild(li);
  });
}

/* =========================================================
   개별(1개씩) 조리 완료
   - 동그라미를 순서대로 눌러 완료 표시
   - 이미 완료로 표시한 동그라미를 다시 누르면 그 지점까지 취소(되돌리기)
   - 한 주문 건(rowNum)의 수량을 모두 완료 표시하면 그 시점에 서버로 완료 요청 전송
   ========================================================= */
function toggleUnit(rowNum, orderId, unitTotal, idx) {
  const done = unitProgress[rowNum] || 0;

  if (idx < done) {
    // 완료 취소: 그 지점까지 되돌리기
    unitProgress[rowNum] = idx;
    refreshCurrentView();
    return;
  }
  if (idx > done) return; // 순서를 건너뛰어 누를 수는 없음

  unitProgress[rowNum] = done + 1;
  refreshCurrentView();

  if (unitProgress[rowNum] >= unitTotal) {
    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'completeItem', rowNum, orderId })
    })
      .then(() => {
        delete unitProgress[rowNum];
        fetchKitchenOrders();
      })
      .catch(err => {
        console.error('출고 오류:', err);
        unitProgress[rowNum] = unitTotal - 1; // 실패 시 마지막 한 칸 되돌리기
        refreshCurrentView();
      });
  }
}

function completeAllTableItems() {
  if (!selectedTableNum || !currentActiveOrders[selectedTableNum]) return;

  const tableData = currentActiveOrders[selectedTableNum];
  tableData.items.forEach(item => {
    item.occurrences.forEach(occ => delete unitProgress[occ.rowNum]);
  });

  const orderNumbers = tableData.orderNumbers;
  const promises = orderNumbers.map(orderNum =>
    fetch(CONFIG.GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'completeCooking', orderNumber: orderNum })
    })
  );

  Promise.all(promises)
    .then(() => {
      closeModal();
      fetchKitchenOrders();
    })
    .catch(err => console.error('전체 완료 오류:', err));
}
</script>
