<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청춘주막 - 주방/서빙 KDS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #333;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ff4d4d;
    }

    .header .status {
      font-size: 0.85rem;
      color: #888;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ec4b6;
      border-radius: 50%;
      display: inline-block;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 600px) {
      .grid-container {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
    }

    .table-card {
      background-color: #1e1e1e;
      border: 2px solid #333;
      border-radius: 10px;
      padding: 10px 8px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .table-card.active {
      background-color: #2a1215;
      border-color: #e63946;
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.4);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .table-num {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ddd;
    }

    .table-card.active .table-num {
      color: #ff6b6b;
    }

    .table-time {
      font-size: 0.7rem;
      color: #aaa;
    }

    .table-summary {
      font-size: 0.8rem;
      color: #bbb;
      margin-top: 4px;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .table-card.active .table-summary {
      color: #ffffff;
      font-weight: 600;
    }

    .item-count-badge {
      align-self: flex-start;
      background-color: #e63946;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 12px;
      margin-top: 4px;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: #242424;
      border-radius: 14px;
      width: 90%;
      max-width: 440px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #444;
    }

    .modal-header {
      background-color: #8b0000;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .btn-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background-color: #333;
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }

    .item-qty {
      background-color: #f1f2f6;
      color: #2f3542;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .modal-footer {
      padding: 14px 16px;
      background-color: #1c1c1c;
      border-top: 1px solid #333;
    }

    .btn-all-complete {
      width: 100%;
      background-color: #2e7d32;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-all-complete:active {
      background-color: #1b5e20;
    }

    .btn-complete {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-complete:active {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>👨‍🍳 주방 현황판 (KDS)</h1>
    <div class="status">
      <span class="status-dot"></span>
      <span id="sync-status">실시간 연결 중...</span>
    </div>
  </div>

  <div class="grid-container" id="grid-container"></div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">테이블 0</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <ul class="item-list" id="modal-item-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="btn-all-complete" onclick="completeAllTableItems()">테이블 전체 완료</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycby9p8Om4wxPwmf_2-fZe6pFkuPPVfsNWfKgVvQtzp_p9I4z2JEd_gRk658s0HPrVhUR/exec', 
      TOTAL_TABLES: 35,
      REFRESH_INTERVAL: 4000
    };

    let currentActiveOrders = {}; // 테이블번호별 병합된 주문 데이터
    let selectedTableNum = null;   // 현재 모달에 열려있는 테이블 번호

    window.onload = function() {
      renderTableGrid();
      fetchKitchenOrders();
      setInterval(fetchKitchenOrders, CONFIG.REFRESH_INTERVAL);
    };

    function renderTableGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
        const card = document.createElement('div');
        card.className = 'table-card';
        card.id = `table-box-${i}`;
        card.onclick = () => openModal(i);

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">${i}</span>
            <span class="table-time" id="table-time-${i}"></span>
          </div>
          <div class="table-summary" id="table-summary-${i}">빈 테이블</div>
          <div id="table-badge-${i}"></div>
        `;
        container.appendChild(card);
      }
    }

    function fetchKitchenOrders() {
      fetch(`${CONFIG.GAS_URL}?action=kitchen`)
        .then(res => res.json())
        .then(data => {
          if (data.success && data.orders) {
            processOrders(data.orders);
            document.getElementById('sync-status').innerText = '실시간 수신 중';
          }
        })
        .catch(err => {
          console.error('주문 불러오기 오류:', err);
          document.getElementById('sync-status').innerText = '연결 확인 필요';
        });
    }

    function processOrders(orders) {
      currentActiveOrders = {}; 

      // 1. 전체 카드 초기화
      for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
        const box = document.getElementById(`table-box-${i}`);
        if (box) {
          box.classList.remove('active');
          document.getElementById(`table-summary-${i}`).innerText = '빈 테이블';
          document.getElementById(`table-time-${i}`).innerText = '';
          document.getElementById(`table-badge-${i}`).innerHTML = '';
        }
      }

      // 2. 주문 데이터를 테이블별로 병합(Merge)
      orders.forEach(order => {
        const rawTable = String(order.table || '');
        const match = rawTable.match(/\d+/);
        const tableNum = match ? parseInt(match[0], 10) : null;
        
        if (tableNum && tableNum >= 1 && tableNum <= CONFIG.TOTAL_TABLES) {
          const validItems = (order.items || []).filter(item => {
            const name = String(item.name || '').trim();
            return !name.startsWith("인원") && !name.includes("인원수");
          });

          if (validItems.length === 0) return;

          if (!currentActiveOrders[tableNum]) {
            currentActiveOrders[tableNum] = {
              table: tableNum,
              firstTime: order.time,
              orderNumbers: [order.orderNumber],
              items: []
            };
          } else {
            if (!currentActiveOrders[tableNum].orderNumbers.includes(order.orderNumber)) {
              currentActiveOrders[tableNum].orderNumbers.push(order.orderNumber);
            }
          }

          // 메뉴 데이터 추가 (같은 메뉴는 수량 합산)
          validItems.forEach(newItem => {
            const qty = parseInt(newItem.qty || 1, 10);
            const existingItem = currentActiveOrders[tableNum].items.find(
              i => i.name === newItem.name
            );

            if (existingItem) {
              existingItem.qty += qty;
              existingItem.rowNums.push(newItem.rowNum);
              if (!existingItem.orderIds.includes(order.orderNumber)) {
                existingItem.orderIds.push(order.orderNumber);
              }
            } else {
              currentActiveOrders[tableNum].items.push({
                name: newItem.name,
                qty: qty,
                rowNums: [newItem.rowNum],
                orderIds: [order.orderNumber]
              });
            }
          });
        }
      });

      // 3. 화면 UI 업데이트
      Object.keys(currentActiveOrders).forEach(tableNum => {
        const tableData = currentActiveOrders[tableNum];
        const items = tableData.items;

        if (items.length > 0) {
          const box = document.getElementById(`table-box-${tableNum}`);
          if (box) box.classList.add('active');

          const firstItem = items[0].name;
          const totalQty = items.reduce((sum, item) => sum + item.qty, 0);
          const summaryText = items.length > 1 ? `${firstItem} 외 ${items.length - 1}건` : `${firstItem} ${items[0].qty}개`;

          document.getElementById(`table-summary-${tableNum}`).innerText = summaryText;
          document.getElementById(`table-time-${tableNum}`).innerText = `⏱ ${tableData.firstTime}`;
          document.getElementById(`table-badge-${tableNum}`).innerHTML = `<span class="item-count-badge">${totalQty}개 메뉴</span>`;
        }
      });

      // 열려있는 모달이 있으면 갱신
      if (selectedTableNum) {
        if (currentActiveOrders[selectedTableNum]) {
          renderModalContent(currentActiveOrders[selectedTableNum]);
        } else {
          closeModal();
        }
      }
    }

    function openModal(tableNum) {
      const tableData = currentActiveOrders[tableNum];
      if (!tableData || !tableData.items || tableData.items.length === 0) return;

      selectedTableNum = tableNum;
      renderModalContent(tableData);
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      selectedTableNum = null;
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function renderModalContent(tableData) {
      document.getElementById('modal-title').innerText = `테이블 ${tableData.table}`;
      const modalItemList = document.getElementById('modal-item-list');
      modalItemList.innerHTML = '';

      if (tableData.items.length === 0) {
        modalItemList.innerHTML = '<li class="item-card"><p style="color:#aaa; text-align:center;">출고할 메뉴가 없습니다.</p></li>';
        return;
      }

      tableData.items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item-card';
        
        // rowNums와 orderIds 배열을 JSON 텍스트 형태로 변환하여 버튼 파라미터로 넘김
        const rowNumsJson = JSON.stringify(item.rowNums);
        const orderIdsJson = JSON.stringify(item.orderIds);

        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-qty">${item.qty}개</span>
          </div>
          <button class="btn-complete" onclick='completeMergedItem(${rowNumsJson}, ${orderIdsJson})'>
            ✔ 출고
          </button>
        `;
        modalItemList.appendChild(li);
      });
    }

    function completeMergedItem(rowNums, orderIds) {
      // 해당 메뉴의 모든 rowNum을 순차적으로 출고 처리
      const promises = rowNums.map((rowNum, idx) => {
        return fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'completeItem',
            rowNum: rowNum,
            orderId: orderIds[idx] || orderIds[0]
          })
        });
      });

      Promise.all(promises).then(() => {
        fetchKitchenOrders();
      }).catch(err => console.error("출고 오류:", err));
    }

    function completeAllTableItems() {
      if (!selectedTableNum || !currentActiveOrders[selectedTableNum]) return;

      const orderNumbers = currentActiveOrders[selectedTableNum].orderNumbers;
      
      const promises = orderNumbers.map(orderNum => {
        return fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'completeCooking',
            orderNumber: orderNum
          })
        });
      });

      Promise.all(promises).then(() => {
        closeModal();
        fetchKitchenOrders();
      }).catch(err => console.error("전체 완료 오류:", err));
    }
  </script>
</body>
</html>
