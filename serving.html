<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청춘주막 - 서빙 현황판</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #1a1a1a;
      color: #ffffff;
      padding: 15px;
      user-select: none;
    }

    /* 헤더 영역 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #333;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f39c12; /* 주막 시그니처 옐로우 */
      letter-spacing: -0.5px;
    }

    .status {
      font-size: 0.85rem;
      color: #aaa;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #282828;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #2ecc71;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px #2ecc71;
    }

    /* 35개 테이블 그리드 레이아웃 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    @media (max-width: 768px) {
      .grid-container {
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
    }

    /* 테이블 카드 기본 (비활성/빈 테이블) */
    .table-card {
      background-color: #262626;
      border: 2px solid #3d3d3d;
      border-radius: 10px;
      padding: 12px 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s ease, border-color 0.2s ease;
    }

    .table-card:active {
      transform: scale(0.98);
    }

    /* 주문이 활성화된 테이블 */
    .table-card.active {
      background-color: #2d2415;
      border-color: #f39c12;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.2);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-num {
      font-size: 1.2rem;
      font-weight: 900;
      color: #888;
    }

    .table-card.active .table-num {
      color: #f39c12;
    }

    .table-summary {
      font-size: 0.85rem;
      color: #666;
      margin-top: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    .table-card.active .table-summary {
      color: #ffffff;
      font-weight: 600;
    }

    .badge-group {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-top: 8px;
    }

    .item-count-badge {
      background-color: #e67e22;
      color: #ffffff;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* 모달 UI */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-content {
      background-color: #2a2a2a;
      border-radius: 14px;
      width: 90%;
      max-width: 450px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      border: 1px solid #444;
    }

    .modal-header {
      background-color: #f39c12;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #1a1a1a;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .btn-close {
      background: none;
      border: none;
      color: #1a1a1a;
      font-size: 1.6rem;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background-color: #333;
      padding: 12px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #444;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-name {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
    }

    .item-qty {
      background-color: #f39c12;
      color: #1a1a1a;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .modal-footer {
      padding: 14px 16px;
      background-color: #222;
      border-top: 1px solid #333;
    }

    .btn-all-complete {
      width: 100%;
      background-color: #e67e22;
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-all-complete:active {
      background-color: #d35400;
    }

    .btn-complete {
      background-color: #2ecc71;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-complete:active {
      background-color: #27ae60;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🍻 청춘주막 서빙 현황판</h1>
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="sync-status">연결 확인 중...</span>
    </div>
  </div>

  <div class="grid-container" id="grid-container"></div>

  <!-- 상세 주문 확인 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">테이블 0</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <ul class="item-list" id="modal-item-list"></ul>
      </div>
      <div class="modal-footer">
        <button class="btn-all-complete" onclick="completeAllTableItems()">테이블 전체 서빙 완료</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      GAS_URL: 'https://script.google.com/macros/s/AKfycby9p8Om4wxPwmf_2-fZe6pFkuPPVfsNWfKgVvQtzp_p9I4z2JEd_gRk658s0HPrVhUR/exec', 
      TOTAL_TABLES: 35,
      REFRESH_INTERVAL: 3000
    };

    let currentActiveOrders = {};
    let selectedTableNum = null;

    window.onload = function() {
      renderTableGrid();
      fetchServingOrders();
      setInterval(fetchServingOrders, CONFIG.REFRESH_INTERVAL);
    };

    function renderTableGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
        const card = document.createElement('div');
        card.className = 'table-card';
        card.id = `table-box-${i}`;
        card.onclick = () => openModal(i);

        card.innerHTML = `
          <div class="table-header">
            <span class="table-num">${i}</span>
          </div>
          <div class="table-summary" id="table-summary-${i}">빈 테이블</div>
          <div class="badge-group" id="table-badge-${i}"></div>
        `;
        container.appendChild(card);
      }
    }

    function fetchServingOrders() {
      // 리디렉션 및 브라우저 캐시 문제를 해결하기 위한 파라미터 추가
      const requestUrl = `${CONFIG.GAS_URL}?action=serving&_=${new Date().getTime()}`;

      fetch(requestUrl, {
        method: 'GET',
        redirect: 'follow'
      })
      .then(res => {
        if (!res.ok) throw new Error('네트워크 응답 이상');
        return res.json();
      })
      .then(data => {
        if (data.success && data.orders) {
          processOrders(data.orders);
          document.getElementById('sync-status').innerText = '실시간 수신 중';
          document.getElementById('status-dot').style.backgroundColor = '#2ecc71';
        } else {
          // 백엔드에서 success가 false이거나 orders가 없을 때
          processOrders([]);
          document.getElementById('sync-status').innerText = '실시간 수신 중 (주문 없음)';
        }
      })
      .catch(err => {
        console.error('주문 불러오기 오류:', err);
        document.getElementById('sync-status').innerText = '연결 확인 필요';
        document.getElementById('status-dot').style.backgroundColor = '#e74c3c';
      });
    }

    function processOrders(orders) {
      // 로컬 메모리 초기화 -> 구글 시트 원본 데이터 상태만 100% 추적 (상태 '확인'으로 변경 시 되돌아옴)
      currentActiveOrders = {}; 

      // 전체 35개 테이블 UI 초기화
      for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
        const box = document.getElementById(`table-box-${i}`);
        if (box) {
          box.className = 'table-card';
          document.getElementById(`table-summary-${i}`).innerText = '빈 테이블';
          document.getElementById(`table-badge-${i}`).innerHTML = '';
        }
      }

      orders.forEach(order => {
        const rawTable = String(order.table || '');
        const match = rawTable.match(/\d+/);
        const tableNum = match ? parseInt(match[0], 10) : null;
        
        if (tableNum && tableNum >= 1 && tableNum <= CONFIG.TOTAL_TABLES) {
          // '인원' 관련 메뉴 필터링
          const validItems = (order.items || []).filter(item => {
            const name = String(item.name || '').trim();
            return !name.startsWith("인원") && !name.includes("인원수");
          });

          if (validItems.length === 0) return;

          if (!currentActiveOrders[tableNum]) {
            currentActiveOrders[tableNum] = {
              table: tableNum,
              orderNumbers: [order.orderNumber],
              items: []
            };
          } else {
            if (!currentActiveOrders[tableNum].orderNumbers.includes(order.orderNumber)) {
              currentActiveOrders[tableNum].orderNumbers.push(order.orderNumber);
            }
          }

          validItems.forEach(newItem => {
            const qty = parseInt(newItem.qty || 1, 10);
            const existingItem = currentActiveOrders[tableNum].items.find(i => i.name === newItem.name);

            if (existingItem) {
              existingItem.qty += qty;
              if (newItem.rowNum) existingItem.rowNums.push(newItem.rowNum);
              if (!existingItem.orderIds.includes(order.orderNumber)) {
                existingItem.orderIds.push(order.orderNumber);
              }
            } else {
              currentActiveOrders[tableNum].items.push({
                name: newItem.name,
                qty: qty,
                rowNums: newItem.rowNum ? [newItem.rowNum] : [],
                orderIds: [order.orderNumber]
              });
            }
          });
        }
      });

      updateUI();

      // 모달이 켜져 있는 상태에서 시트 데이터가 바뀐 경우 실시간 갱신
      if (selectedTableNum) {
        if (currentActiveOrders[selectedTableNum]) {
          renderModalContent(currentActiveOrders[selectedTableNum]);
        } else {
          closeModal();
        }
      }
    }

    function updateUI() {
      for (let i = 1; i <= CONFIG.TOTAL_TABLES; i++) {
        const box = document.getElementById(`table-box-${i}`);
        const tableData = currentActiveOrders[i];

        if (!tableData || !tableData.items || tableData.items.length === 0) {
          continue;
        }

        box.classList.add('active');

        const firstItem = tableData.items[0].name;
        const totalQty = tableData.items.reduce((sum, item) => sum + item.qty, 0);
        const summaryText = tableData.items.length > 1 
          ? `${firstItem} 외 ${tableData.items.length - 1}건` 
          : `${firstItem} ${tableData.items[0].qty}개`;

        document.getElementById(`table-summary-${i}`).innerText = summaryText;
        document.getElementById(`table-badge-${i}`).innerHTML = `<span class="item-count-badge">${totalQty}개 메뉴</span>`;
      }
    }

    function openModal(tableNum) {
      const tableData = currentActiveOrders[tableNum];
      if (!tableData || !tableData.items || tableData.items.length === 0) return;

      selectedTableNum = tableNum;
      renderModalContent(tableData);
      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeModal() {
      selectedTableNum = null;
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function renderModalContent(tableData) {
      document.getElementById('modal-title').innerText = `테이블 ${tableData.table}`;

      const modalItemList = document.getElementById('modal-item-list');
      modalItemList.innerHTML = '';

      tableData.items.forEach(item => {
        const li = document.createElement('li');
        li.className = 'item-card';
        
        const rowNumsJson = JSON.stringify(item.rowNums);
        const orderIdsJson = JSON.stringify(item.orderIds);

        li.innerHTML = `
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-qty">${item.qty}개</span>
          </div>
          <button class="btn-complete" onclick='completeMergedItem(${rowNumsJson}, ${orderIdsJson})'>
            ✔ 서빙완료
          </button>
        `;
        modalItemList.appendChild(li);
      });
    }

    function completeMergedItem(rowNums, orderIds) {
      const promises = rowNums.map((rowNum, idx) => {
        return fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'completeItem',
            rowNum: rowNum,
            orderId: orderIds[idx] || orderIds[0]
          })
        });
      });

      Promise.all(promises).then(() => {
        fetchServingOrders();
      }).catch(err => console.error("서빙완료 처리 오류:", err));
    }

    function completeAllTableItems() {
      if (!selectedTableNum || !currentActiveOrders[selectedTableNum]) return;

      const orderNumbers = currentActiveOrders[selectedTableNum].orderNumbers;
      
      const promises = orderNumbers.map(orderNum => {
        return fetch(CONFIG.GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({
            action: 'completeServing',
            orderNumber: orderNum
          })
        });
      });

      Promise.all(promises).then(() => {
        closeModal();
        fetchServingOrders();
      }).catch(err => console.error("전체 완료 오류:", err));
    }
  </script>
</body>
</html>
